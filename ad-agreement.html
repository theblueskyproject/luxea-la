document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

cus, input[type=\"tel\"]:focus, input[type=\"date\"]:focus, textarea:focus {\n      border-bottom: 1.5px solid #ec3013;\n    }\n    label.lx-radio, label.lx-check { display: flex; align-items: flex-start; gap: 10px; cursor: pointer; font-size: 13px; font-weight: 400; color: #201e1d; }\n    input[type=\"radio\"], input[type=\"checkbox\"] { accent-color: #ec3013; width: 16px; height: 16px; flex: none; margin-top: 1px; cursor: pointer; }\n    @media (max-width: 720px) {\n      [data-r=\"grid2\"] { grid-template-columns: 1fr !important; }\n      [data-r=\"sections\"] { grid-template-columns: repeat(2, 1fr) !important; }\n      [data-r=\"sig2\"] { grid-template-columns: 1fr !important; }\n    }\n  <\u002Fstyle>\n<\u002Fhelmet>\n\n\n<div style=\"max-width: 760px; margin: 0 auto; padding: 64px 24px 120px;\">\n\n  <!-- LOGO / HEADER -->\n  <div style=\"display: flex; align-items: flex-end; justify-content: space-between; border-bottom: 1.5px solid #ec3013; padding-bottom: 14px; margin-bottom: 40px;\">\n    <img src=\"9277fa87-7530-4d45-ac22-6dffd656e038\" alt=\"LUXÉA — Los Angeles\" style=\"display: block; height: 40px; width: auto;\">\n    <div style=\"font-size: 9px; font-weight: 500; letter-spacing: 0.2em; color: rgba(32,30,29,0.6); text-align: right;\">ADVERTISING AGREEMENT<br>FULL PAGE<\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"font-size: 10px; font-weight: 500; letter-spacing: 0.28em; color: #c62a10; margin-bottom: 10px;\">A COLLECTOR'S BLACK BOOK MADE OF PURE ELEGANCE<\u002Fdiv>\n  <h1 style=\"font-size: 34px; font-weight: 200; letter-spacing: 0.01em; line-height: 1.1; color: #201e1d; margin: 0 0 8px;\">Advertising Agreement<\u002Fh1>\n  <div style=\"font-size: 14px; font-weight: 300; color: rgba(32,30,29,0.75); margin-bottom: 30px;\">LUXÉA — First Edition, Spring 2027<\u002Fdiv>\n\n  <p style=\"font-size: 14px; font-weight: 300; line-height: 1.6; color: #201e1d; margin-bottom: 40px;\">This Advertising Agreement (the \"Agreement\") is entered into between <strong style=\"font-weight: 500;\">Ignyte Transformational Media<\u002Fstrong>, publisher of LUXÉA (\"Publisher\"), and the advertiser named below (\"Advertiser\"), together the \"Parties,\" effective as of the date of countersignature by Publisher. Please complete every field below, review the terms, and select a placement to proceed to payment.<\u002Fp>\n\n  <form action=\"https://api.web3forms.com/submit\" method=\"POST\" sc-camel-on-submit=\"{{ handleSubmit }}\" style=\"display: flex; flex-direction: column; gap: 46px;\">\n    <input type=\"hidden\" name=\"access_key\" value=\"540c1464-5e9b-47b3-af20-f034e700d5dd\">\n    <input type=\"hidden\" name=\"subject\" value=\"LUXÉA — Advertising Agreement submission\">\n    <input type=\"hidden\" name=\"Section Selected\" value=\"{{ sectionLabel }}\">\n    <input type=\"hidden\" name=\"Ad Design Add-on\" value=\"{{ adDesignLabel }}\">\n    <input type=\"hidden\" name=\"Total Due\" value=\"{{ totalLabel }}\">\n\n    <!-- 1. ADVERTISER INFO -->\n    <div>\n      <div style=\"font-size: 11px; font-weight: 500; letter-spacing: 0.16em; color: #201e1d; text-transform: uppercase; margin-bottom: 18px;\">1 · Advertiser Information<\u002Fdiv>\n      <div data-r=\"grid2\" style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 22px 30px;\">\n        <label>Business Name<input type=\"text\" name=\"Business Name\" required=\"{{ true }}\"><\u002Flabel>\n        <label>Legal Entity Name<input type=\"text\" name=\"Legal Entity Name\" required=\"{{ true }}\"><\u002Flabel>\n        <label>Contact Name / Title<input type=\"text\" name=\"Contact Name / Title\" required=\"{{ true }}\"><\u002Flabel>\n        <label>Address<input type=\"text\" name=\"Address\" required=\"{{ true }}\"><\u002Flabel>\n        <label>Phone<input type=\"tel\" name=\"Phone\" required=\"{{ true }}\"><\u002Flabel>\n        <label>Email<input type=\"email\" name=\"Email\" required=\"{{ true }}\"><\u002Flabel>\n        <label style=\"grid-column: 1 / -1;\">Website / Instagram<input type=\"text\" name=\"Website / Instagram\"><\u002Flabel>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <style>\n      form label { display: flex; flex-direction: column; gap: 6px; font-size: 11px; font-weight: 500; letter-spacing: 0.06em; color: rgba(32,30,29,0.7); text-transform: uppercase; }\n    <\u002Fstyle>\n\n    <!-- 2. PUBLICATION -->\n    <div>\n      <div style=\"font-size: 11px; font-weight: 500; letter-spacing: 0.16em; color: #201e1d; text-transform: uppercase; margin-bottom: 12px;\">2 · The Publication<\u002Fdiv>\n      <p style=\"font-size: 14px; font-weight: 300; line-height: 1.6; color: #201e1d; margin: 0;\">Publisher is producing LUXÉA, a luxury collector's Black Book to Los Angeles (the \"Publication\"), First Edition, to be published and distributed in Spring 2027 with an initial print run of 30,000 copies, placed through luxury hotels, private clubs, aviation terminals, and curated locations across Los Angeles and its surrounding escapes.<\u002Fp>\n    <\u002Fdiv>\n\n    <!-- 3. PLACEMENT -->\n    <div style=\"border: 1px solid rgba(32,30,29,0.2); padding: 26px 26px 28px;\">\n      <div style=\"font-size: 11px; font-weight: 500; letter-spacing: 0.16em; color: #201e1d; text-transform: uppercase; margin-bottom: 18px;\">3 · Placement<\u002Fdiv>\n\n      <div style=\"font-size: 12px; font-weight: 500; letter-spacing: 0.08em; color: rgba(32,30,29,0.7); margin-bottom: 10px; text-transform: uppercase;\">Section (select one)<\u002Fdiv>\n      <div data-r=\"sections\" style=\"display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px 14px; margin-bottom: 24px;\">\n        <sc-for list=\"{{ sectionOptions }}\" as=\"opt\" hint-placeholder-count=\"7\">\n          <label class=\"lx-radio\"><input type=\"radio\" name=\"Section\" value=\"{{ opt }}\" checked=\"{{ opt === section }}\" sc-camel-on-change=\"{{ () =&gt; setSection(opt) }}\">{{ opt }}<\u002Flabel>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <div style=\"font-size: 12px; font-weight: 500; letter-spacing: 0.08em; color: rgba(32,30,29,0.7); margin-bottom: 10px; text-transform: uppercase;\">Placement type<\u002Fdiv>\n      <div style=\"font-size: 14px; font-weight: 500; color: #201e1d; margin-bottom: 22px;\">Full Page, print Black Book — run of section — $2,800 per edition<\u002Fdiv>\n\n      <div style=\"border: 0.75px solid rgba(32,30,29,0.3); border-left: 3px solid #ec3013; padding: 16px 18px; margin-bottom: 22px;\">\n        <div style=\"font-size: 9px; font-weight: 500; letter-spacing: 0.2em; color: #c62a10; margin-bottom: 10px;\">INCLUDED AT NO ADDITIONAL CHARGE<\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 8px; font-size: 12.5px; font-weight: 300; line-height: 1.45; color: #201e1d;\">\n          <div><span style=\"color: #ec3013; font-weight: 500;\">1<\u002Fspan>&nbsp; <span style=\"font-weight: 500;\">Your full page in the digital edition<\u002Fspan> — embedded on LuxeaLA.com, live for twelve months.<\u002Fdiv>\n          <div><span style=\"color: #ec3013; font-weight: 500;\">2<\u002Fspan>&nbsp; <span style=\"font-weight: 500;\">A featured listing in the LUXÉA Directory<\u002Fspan> for twelve months.<\u002Fdiv>\n          <div><span style=\"color: #ec3013; font-weight: 500;\">3<\u002Fspan>&nbsp; <span style=\"font-weight: 500;\">LUXÉA Concierge<\u002Fspan> — carried for twelve months.<\u002Fdiv>\n          <div><span style=\"color: #ec3013; font-weight: 500;\">4<\u002Fspan>&nbsp; <span style=\"font-weight: 500;\">A gold dynamic QR code<\u002Fspan> to a destination of your choosing.<\u002Fdiv>\n          <div><span style=\"color: #ec3013; font-weight: 500;\">5<\u002Fspan>&nbsp; <span style=\"font-weight: 500;\">A gold pin<\u002Fspan> on the detachable map in every printed copy.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"font-size: 12px; font-weight: 500; letter-spacing: 0.08em; color: rgba(32,30,29,0.7); margin-bottom: 10px; text-transform: uppercase;\">Optional<\u002Fdiv>\n      <label class=\"lx-check\"><input type=\"checkbox\" name=\"Ad Design Add-on\" checked=\"{{ adDesign }}\" sc-camel-on-change=\"{{ toggleAdDesign }}\"><span><span style=\"font-weight: 500;\">Advertisement design — $250<\u002Fspan><br><span style=\"font-size: 12px; color: rgba(32,30,29,0.65); font-weight: 300;\">Publisher designs the full-page advertisement from Advertiser's photography, logo, and copy. One concept and two rounds of revision. See Section 6.5.<\u002Fspan><\u002Fspan><\u002Flabel>\n    <\u002Fdiv>\n\n    <!-- 4. PAYMENT -->\n    <div>\n      <div style=\"font-size: 11px; font-weight: 500; letter-spacing: 0.16em; color: #201e1d; text-transform: uppercase; margin-bottom: 14px;\">4 · Payment<\u002Fdiv>\n      <p style=\"font-size: 14px; font-weight: 300; line-height: 1.6; color: #201e1d; margin: 0 0 10px;\">4.1&nbsp; The amount due is payable in full upon signing this Agreement, and in no event later than <strong style=\"font-weight: 500;\">October 22, 2026<\u002Fstrong>, whichever occurs first.<\u002Fp>\n      <p style=\"font-size: 14px; font-weight: 300; line-height: 1.6; color: #201e1d; margin: 0 0 10px;\">4.2&nbsp; Upon receipt of full payment, Advertiser's rate, section, and placement are confirmed and locked for the First Edition.<\u002Fp>\n      <p style=\"font-size: 14px; font-weight: 300; line-height: 1.6; color: #201e1d; margin: 0 0 10px;\">4.3&nbsp; Payments are processed through SwipeSimple, by the payment link matching your selection above.<\u002Fp>\n      <p style=\"font-size: 14px; font-weight: 300; line-height: 1.6; color: #201e1d; margin: 0 0 24px;\">4.4&nbsp; If full payment is not received by the date above, Publisher may release the reserved placement to another party. Any amount already paid is non-refundable.<\u002Fp>\n\n      <div style=\"display: flex; align-items: center; gap: 8px; margin-bottom: 10px;\">\n        <svg width=\"13\" height=\"13\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"rgba(32,30,29,0.6)\" stroke-width=\"2\"><rect x=\"5\" y=\"11\" width=\"14\" height=\"9\" rx=\"1\"><\u002Frect><path d=\"M8 11V7a4 4 0 0 1 8 0v4\"><\u002Fpath><\u002Fsvg>\n        <div style=\"font-size: 10px; font-weight: 500; letter-spacing: 0.2em; color: rgba(32,30,29,0.6); text-transform: uppercase;\">Secure Payment · Processed by SwipeSimple<\u002Fdiv>\n      <\u002Fdiv>\n      <div data-r=\"grid2\" style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 16px;\">\n        <div style=\"background: #201e1d; padding: 24px; display: flex; flex-direction: column; gap: 14px;\">\n          <div>\n            <div style=\"font-size: 9px; font-weight: 500; letter-spacing: 0.2em; color: #f8712c; margin-bottom: 8px;\">FULL PAGE<\u002Fdiv>\n            <div style=\"font-size: 28px; font-weight: 200; color: #ffffff;\">$2,800<\u002Fdiv>\n            <div style=\"font-size: 11.5px; font-weight: 300; color: rgba(255,255,255,0.6); margin-top: 4px;\">Full page placement, {{ section }}<\u002Fdiv>\n          <\u002Fdiv>\n          <a href=\"https://swipesimple.com/links/lnk_352f6373f02ff8ef3dcce64562d02113\" target=\"_blank\" rel=\"noopener\" style=\"background: #ec3013; color: #ffffff; font-size: 11.5px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; padding: 13px 18px; white-space: nowrap; text-align: center;\">Pay $2,800 →<\u002Fa>\n        <\u002Fdiv>\n        <div style=\"background: #201e1d; padding: 24px; display: flex; flex-direction: column; gap: 14px;\">\n          <div>\n            <div style=\"font-size: 9px; font-weight: 500; letter-spacing: 0.2em; color: #f8712c; margin-bottom: 8px;\">FULL PAGE + AD DESIGN<\u002Fdiv>\n            <div style=\"font-size: 28px; font-weight: 200; color: #ffffff;\">$3,050<\u002Fdiv>\n            <div style=\"font-size: 11.5px; font-weight: 300; color: rgba(255,255,255,0.6); margin-top: 4px;\">Full page placement + $250 Advertisement design<\u002Fdiv>\n          <\u002Fdiv>\n          <a href=\"https://swipesimple.com/links/lnk_b19ff6fd5a63277379737b542649ea8c\" target=\"_blank\" rel=\"noopener\" style=\"background: #ec3013; color: #ffffff; font-size: 11.5px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; padding: 13px 18px; white-space: nowrap; text-align: center;\">Pay $3,050 →<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-size: 11.5px; font-weight: 300; color: rgba(32,30,29,0.6); margin-top: 10px;\">Use the link matching the Optional Advertisement design selection made in Section 3.<\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- 5. CANCELLATION -->\n    <div>\n      <div style=\"font-size: 11px; font-weight: 500; letter-spacing: 0.16em; color: #201e1d; text-transform: uppercase; margin-bottom: 12px;\">5 · Cancellation<\u002Fdiv>\n      <p style=\"font-size: 13.5px; font-weight: 300; line-height: 1.6; color: #201e1d; margin: 0 0 8px;\">5.1&nbsp; All payments made under this Agreement are non-refundable once received, regardless of the reason for cancellation.<\u002Fp>\n      <p style=\"font-size: 13.5px; font-weight: 300; line-height: 1.6; color: #201e1d; margin: 0 0 8px;\">5.2&nbsp; If Advertiser cancels at any time, Publisher may reassign the placement without further obligation to Advertiser.<\u002Fp>\n      <p style=\"font-size: 13.5px; font-weight: 300; line-height: 1.6; color: #201e1d; margin: 0 0 8px;\">5.3&nbsp; Publisher may cancel this Agreement and reassign Advertiser's placement, without penalty to Publisher, if the payment terms set out in Section 4 are not met.<\u002Fp>\n      <p style=\"font-size: 13.5px; font-weight: 300; line-height: 1.6; color: #201e1d; margin: 0;\">5.4&nbsp; If Advertiser ceases trading, closes the advertised business, or the business changes ownership, Advertiser will notify Publisher in writing without delay. The rate paid remains non-refundable and is not transferable.<\u002Fp>\n    <\u002Fdiv>\n\n    <!-- 6. MATERIALS -->\n    <div>\n      <div style=\"font-size: 11px; font-weight: 500; letter-spacing: 0.16em; color: #201e1d; text-transform: uppercase; margin-bottom: 12px;\">6 · Advertising Materials<\u002Fdiv>\n      <p style=\"font-size: 13.5px; font-weight: 300; line-height: 1.6; color: #201e1d; margin: 0 0 8px;\">6.1&nbsp; Advertiser is responsible for delivering final, print-ready artwork, together with one photograph for the featured directory listing, no later than <strong style=\"font-weight: 500;\">October 22, 2026<\u002Fstrong>.<\u002Fp>\n      <p style=\"font-size: 13.5px; font-weight: 300; line-height: 1.6; color: #201e1d; margin: 0 0 8px;\">6.2&nbsp; Complete written specifications are published at <a href=\"https://www.luxeala.com/print-specs\" style=\"font-weight: 500;\">LuxeaLA.com/print-specs<\u002Fa> and confirmed upon countersignature. Materials not meeting specification are not considered delivered.<\u002Fp>\n      <p style=\"font-size: 13.5px; font-weight: 300; line-height: 1.6; color: #201e1d; margin: 0 0 8px;\">6.3&nbsp; Publisher may request reasonable modifications to submitted artwork that do not align with LUXÉA's brand, aesthetic, or editorial tone.<\u002Fp>\n      <p style=\"font-size: 13.5px; font-weight: 300; line-height: 1.6; color: #201e1d; margin: 0 0 8px;\">6.4&nbsp; If revised materials are not received in time, Publisher may use the most recently submitted compliant materials, or hold the placement open, without refund.<\u002Fp>\n      <p style=\"font-size: 13.5px; font-weight: 300; line-height: 1.6; color: #201e1d; margin: 0 0 8px;\">6.5&nbsp; If Advertiser selects Advertisement design in Section 3, Publisher designs the full-page advertisement — one concept, two rounds of revision — for the fee set out in Section 4.1, non-refundable. Once approved, the finished advertisement belongs to Advertiser.<\u002Fp>\n      <p style=\"font-size: 13.5px; font-weight: 300; line-height: 1.6; color: #201e1d; margin: 0;\">6.6&nbsp; Advertiser warrants that it holds all rights necessary to publish the artwork it submits.<\u002Fp>\n    <\u002Fdiv>\n\n    <!-- 7-9 -->\n    <div>\n      <div style=\"font-size: 11px; font-weight: 500; letter-spacing: 0.16em; color: #201e1d; text-transform: uppercase; margin-bottom: 12px;\">7 · Digital Version of the Print Black Book<\u002Fdiv>\n      <p style=\"font-size: 13.5px; font-weight: 300; line-height: 1.6; color: #201e1d; margin: 0;\">A full-page print placement appears in the digital version embedded on LuxeaLA.com, exactly as it appears in print, remaining available for twelve months from publication.<\u002Fp>\n    <\u002Fdiv>\n    <div>\n      <div style=\"font-size: 11px; font-weight: 500; letter-spacing: 0.16em; color: #201e1d; text-transform: uppercase; margin-bottom: 12px;\">8 · Featured Directory Listing<\u002Fdiv>\n      <p style=\"font-size: 13.5px; font-weight: 300; line-height: 1.6; color: #201e1d; margin: 0;\">Advertiser receives a featured listing in the LUXÉA Directory on LuxeaLA.com for twelve months, at no additional charge, available only to advertisers in the printed guide. Publisher does not guarantee traffic, impressions, enquiries, or ranking.<\u002Fp>\n    <\u002Fdiv>\n    <div>\n      <div style=\"font-size: 11px; font-weight: 500; letter-spacing: 0.16em; color: #201e1d; text-transform: uppercase; margin-bottom: 12px;\">9 · LUXÉA Concierge<\u002Fdiv>\n      <p style=\"font-size: 13.5px; font-weight: 300; line-height: 1.6; color: #201e1d; margin: 0;\">Advertiser is carried within LUXÉA Concierge for twelve months from publication, at no additional charge. Publisher does not guarantee any particular level of enquiries, referrals, or frequency of surfacing.<\u002Fp>\n    <\u002Fdiv>\n\n    <!-- 10-16 -->\n    <div>\n      <div style=\"font-size: 11px; font-weight: 500; letter-spacing: 0.16em; color: #201e1d; text-transform: uppercase; margin-bottom: 12px;\">10 · First Edition and Second Edition<\u002Fdiv>\n      <p style=\"font-size: 13.5px; font-weight: 300; line-height: 1.6; color: #201e1d; margin: 0 0 8px;\">10.1&nbsp; The rate stated in Section 3 reflects Publisher's introductory First Edition rate.<\u002Fp>\n      <p style=\"font-size: 13.5px; font-weight: 300; line-height: 1.6; color: #201e1d; margin: 0 0 8px;\">10.2&nbsp; Rates for the Second Edition, published Spring 2028 ahead of <strong style=\"font-weight: 500;\">the summer the world comes to Los Angeles<\u002Fstrong>, will be established separately and may be higher.<\u002Fp>\n      <p style=\"font-size: 13.5px; font-weight: 300; line-height: 1.6; color: #201e1d; margin: 0;\">10.3&nbsp; As a First Edition advertiser in good standing, Advertiser receives first right of refusal on placement, section, and position for the Second Edition.<\u002Fp>\n    <\u002Fdiv>\n    <div>\n      <div style=\"font-size: 11px; font-weight: 500; letter-spacing: 0.16em; color: #201e1d; text-transform: uppercase; margin-bottom: 12px;\">11 · Exclusivity<\u002Fdiv>\n      <p style=\"font-size: 13.5px; font-weight: 300; line-height: 1.6; color: #201e1d; margin: 0;\">Publisher does not guarantee exclusivity of category or product type within a section unless negotiated and recorded in a written addendum signed by both Parties.<\u002Fp>\n    <\u002Fdiv>\n    <div>\n      <div style=\"font-size: 11px; font-weight: 500; letter-spacing: 0.16em; color: #201e1d; text-transform: uppercase; margin-bottom: 12px;\">12 · Term<\u002Fdiv>\n      <p style=\"font-size: 13.5px; font-weight: 300; line-height: 1.6; color: #201e1d; margin: 0;\">This Agreement applies solely to the LUXÉA First Edition, Spring 2027, and obligates neither Party beyond that publication, except as stated in Sections 3, 7, 8, 9, and 10.<\u002Fp>\n    <\u002Fdiv>\n    <div>\n      <div style=\"font-size: 11px; font-weight: 500; letter-spacing: 0.16em; color: #201e1d; text-transform: uppercase; margin-bottom: 12px;\">13 · Limitation of Liability<\u002Fdiv>\n      <p style=\"font-size: 13.5px; font-weight: 300; line-height: 1.6; color: #201e1d; margin: 0;\">Publisher's liability for any error, omission, or defect in placement or reproduction, or failure to publish, shall not exceed the amount paid by Advertiser. Neither Party is liable for indirect, incidental, or consequential damages.<\u002Fp>\n    <\u002Fdiv>\n    <div>\n      <div style=\"font-size: 11px; font-weight: 500; letter-spacing: 0.16em; color: #201e1d; text-transform: uppercase; margin-bottom: 12px;\">14 · Force Majeure<\u002Fdiv>\n      <p style=\"font-size: 13.5px; font-weight: 300; line-height: 1.6; color: #201e1d; margin: 0;\">Neither Party is liable for delay or failure to perform due to causes beyond its reasonable control, including natural disaster, labour dispute, printing or supply chain disruption, or government action.<\u002Fp>\n    <\u002Fdiv>\n    <div>\n      <div style=\"font-size: 11px; font-weight: 500; letter-spacing: 0.16em; color: #201e1d; text-transform: uppercase; margin-bottom: 12px;\">15 · Governing Law<\u002Fdiv>\n      <p style=\"font-size: 13.5px; font-weight: 300; line-height: 1.6; color: #201e1d; margin: 0;\">This Agreement is governed by the laws of the State of California, and the Parties submit to the exclusive jurisdiction of the state and federal courts in Los Angeles County, California.<\u002Fp>\n    <\u002Fdiv>\n    <div>\n      <div style=\"font-size: 11px; font-weight: 500; letter-spacing: 0.16em; color: #201e1d; text-transform: uppercase; margin-bottom: 12px;\">16 · Entire Agreement<\u002Fdiv>\n      <p style=\"font-size: 13.5px; font-weight: 300; line-height: 1.6; color: #201e1d; margin: 0;\">This Agreement is the entire understanding between the Parties on its subject matter and supersedes all prior discussions and agreements. It may be amended only in writing, signed by both Parties. An electronic signature or a scanned counterpart has the same effect as an original.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"height: 1.5px; background: #ec3013; width: 70px; margin: 6px 0;\"><\u002Fdiv>\n\n    <!-- SIGNATURE -->\n    <div>\n      <div style=\"font-size: 11px; font-weight: 500; letter-spacing: 0.16em; color: #201e1d; text-transform: uppercase; margin-bottom: 20px;\">Signature<\u002Fdiv>\n      <div data-r=\"sig2\" style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 30px; margin-bottom: 24px;\">\n        <div>\n          <div style=\"font-size: 9px; font-weight: 500; letter-spacing: 0.2em; color: #c62a10; margin-bottom: 12px;\">PUBLISHER<\u002Fdiv>\n          <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\"><style>/* latin-ext */\n@font-face {\n  font-family: 'Petit Formal Script';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"1b4e12b7-9e5a-4e6d-b0c2-afff01f0cac4\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Petit Formal Script';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"e00657f5-2b56-496a-9d05-6204e54093fa\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n          <div style=\"font-family: 'Petit Formal Script', cursive; font-size: 21px; color: #201e1d; margin-bottom: 6px;\">Brigitte Perreault<\u002Fdiv>\n          <div style=\"font-size: 14px; font-weight: 400; color: #201e1d;\">Brigitte Perreault<\u002Fdiv>\n          <div style=\"font-size: 12.5px; font-weight: 300; line-height: 1.4; color: rgba(32,30,29,0.75); margin-bottom: 10px;\">Founder and Publisher, LUXÉA<br>Ignyte Transformational Media<\u002Fdiv>\n          <div style=\"font-size: 11px; font-weight: 300; line-height: 1.5; color: rgba(32,30,29,0.55); font-style: italic;\">This signature is affixed electronically by Publisher and constitutes Publisher's countersignature upon Advertiser's submission of this Agreement.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 16px;\">\n          <div style=\"font-size: 9px; font-weight: 500; letter-spacing: 0.2em; color: #c62a10;\">ADVERTISER<\u002Fdiv>\n          <label>Typed Signature (full legal name)<input type=\"text\" name=\"Advertiser Signature\" required=\"{{ true }}\"><\u002Flabel>\n          <label>Name and Title<input type=\"text\" name=\"Advertiser Name and Title\" required=\"{{ true }}\"><\u002Flabel>\n          <label>Company<input type=\"text\" name=\"Advertiser Company\" required=\"{{ true }}\"><\u002Flabel>\n          <label>Date<input type=\"date\" name=\"Advertiser Signature Date\" required=\"{{ true }}\"><\u002Flabel>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <label class=\"lx-check\" style=\"margin-bottom: 30px;\">\n        <input type=\"checkbox\" required=\"{{ true }}\" checked=\"{{ agree }}\" sc-camel-on-change=\"{{ toggleAgree }}\">\n        <span style=\"font-size: 12.5px; font-weight: 300; line-height: 1.5; color: #201e1d;\">I have read and agree to the terms of this Advertising Agreement, and I am authorized to sign on behalf of the Advertiser named above. My typed name above constitutes my electronic signature.<\u002Fspan>\n      <\u002Flabel>\n\n      <sc-if value=\"{{ submitted }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"background: #201e1d; color: #ffffff; padding: 22px 26px; font-size: 14px; font-weight: 300;\">Agreement submitted. Please complete payment above if you have not already — your placement is confirmed once full payment is received.<\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ notSubmitted }}\" hint-placeholder-val=\"{{ true }}\">\n        <button type=\"submit\" style=\"background: #ec3013; color: #ffffff; border: none; font-size: 13px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; padding: 18px 30px; cursor: pointer; width: 100%;\">Submit Agreement<\u002Fbutton>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fform>\n\n  <div style=\"margin-top: 60px; padding-top: 20px; border-top: 0.75px solid rgba(32,30,29,0.2); display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px;\">\n    <div style=\"font-size: 10px; font-weight: 300; letter-spacing: 0.1em; color: rgba(32,30,29,0.55);\">LUXÉA is a division of Ignyte Transformational Media · LuxeaLA.com<\u002Fdiv>\n    <div style=\"font-size: 10px; font-weight: 300; letter-spacing: 0.1em; color: rgba(32,30,29,0.55);\">First Edition · Spring 2027<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nconst SECTION_OPTIONS = ['DINE','SHOP','WELLNESS','CULTURE','NIGHT','ESCAPES'];\nconst LINK_BASE = 'https://swipesimple.com/links/lnk_352f6373f02ff8ef3dcce64562d02113';\nconst LINK_DESIGN = 'https://swipesimple.com/links/lnk_b19ff6fd5a63277379737b542649ea8c';\n\nclass Component extends DCLogic {\n  state = { section: 'DINE', adDesign: false, agree: false, submitted: false };\n\n  setSection(opt) { this.setState({ section: opt }); }\n  toggleAdDesign() { this.setState(s => ({ adDesign: !s.adDesign })); }\n  toggleAgree() { this.setState(s => ({ agree: !s.agree })); }\n  handleSubmit() { this.setState({ submitted: true }); }\n\n  renderVals() {\n    const total = this.state.adDesign ? 3050 : 2800;\n    return {\n      sectionOptions: SECTION_OPTIONS,\n      section: this.state.section,\n      sectionLabel: this.state.section,\n      adDesign: this.state.adDesign,\n      adDesignLabel: this.state.adDesign ? 'Yes — $250' : 'No',\n      adDesignNote: this.state.adDesign ? 'Full Page ($2,800) + Advertisement Design ($250)' : 'Full Page placement, ' + this.state.section,\n      totalLabel: '$' + total.toLocaleString(),\n      paymentLink: this.state.adDesign ? LINK_DESIGN : LINK_BASE,\n      agree: this.state.agree,\n      submitted: this.state.submitted,\n      notSubmitted: !this.state.submitted,\n
